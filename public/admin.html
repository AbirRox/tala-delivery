<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kwiky | Admin Command Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --primary: #fc8019; --card: #1e293b; --green: #22c55e; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0b1120; color: white; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 14px 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .order-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .btn-act { padding: 8px 12px; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>

  <div class="header">
    <h2><i class="fa-solid fa-bolt" style="color:var(--primary);"></i> Kwiky Admin Command</h2>
    <span style="color:var(--green); font-weight:800;">● Live Realtime Sync</span>
  </div>

  <div class="orders-grid" id="ordersBox">Loading orders...</div>

  <script>
    const socket = io();

    async function loadOrders() {
      const res = await fetch('/api/orders');
      const data = await res.json();
      const container = document.getElementById('ordersBox');
      const orders = data.orders || [];

      if (orders.length === 0) {
        container.innerHTML = `<p style="color:#94a3b8;">No orders available.</p>`;
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="order-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <strong>#${o._id.slice(-6)}</strong>
            <span style="color:var(--primary); font-weight:800;">${o.status}</span>
          </div>
          <p style="font-size:13px;">Customer: ${o.name} (${o.phone})</p>
          <p style="font-size:12px; color:#94a3b8; margin:4px 0 10px;">Address: ${o.address}</p>
          <p style="color:var(--green); font-weight:900; margin-bottom:10px;">Total: ৳${o.total} (COD)</p>
          <div style="display:flex; gap:6px;">
            <button class="btn-act" style="background:#f59e0b; color:white;" onclick="updateStatus('${o._id}', 'Preparing')">Preparing</button>
            <button class="btn-act" style="background:#0284c7; color:white;" onclick="updateStatus('${o._id}', 'Out for Delivery')">Dispatch</button>
            <button class="btn-act" style="background:var(--green); color:white;" onclick="updateStatus('${o._id}', 'Delivered')">Delivered</button>
          </div>
        </div>
      `).join('');
    }

    async function updateStatus(id, status) {
      await fetch(`/api/order/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadOrders();
    }

    socket.on('order:new', () => loadOrders());
    window.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
