<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MediInfo World</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- HEADER -->
    <header class="bg-white sticky top-0 z-50 shadow-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-3xl bg-teal-100 text-teal-600 p-2 rounded-2xl">🛡️</span>
                <div>
                    <h1 class="text-xl font-black text-slate-900 tracking-tight">Admin <span class="text-teal-600">Portal</span></h1>
                    <p class="text-xs font-bold text-slate-400">Add New Medicine to Encyclopedia</p>
                </div>
            </div>
            <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2.5 rounded-xl font-bold text-sm transition-all">
                ← Back to Website
            </a>
        </div>
    </header>

    <!-- FORM CONTAINER -->
    <main class="max-w-3xl mx-auto px-4 py-12">
        <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
            <h2 class="text-xl font-black text-slate-900 mb-6 pb-4 border-b border-slate-100">Add Medicine Details</h2>

            <form id="medicineForm" onsubmit="submitMedicine(event)" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Medicine Name & Strength</label>
                        <input type="text" id="medName" required placeholder="e.g. Paracetamol 500mg" 
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Generic Salt / Formula</label>
                        <input type="text" id="genericName" required placeholder="e.g. Acetaminophen" 
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Popular Brands</label>
                        <input type="text" id="brand" required placeholder="e.g. Crocin, Calpol" 
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Category</label>
                        <select id="category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                            <option value="Pain Relief & Fever">Pain Relief & Fever</option>
                            <option value="Antibiotic">Antibiotic</option>
                            <option value="Gastric & Antacid">Gastric & Antacid</option>
                            <option value="Diabetes Care">Diabetes Care</option>
                            <option value="Antihistamine / Allergy">Antihistamine / Allergy</option>
                            <option value="Cardiovascular">Cardiovascular</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Primary Uses & Benefits</label>
                    <textarea id="uses" rows="3" required placeholder="Explain what this medicine treats..." 
                              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Correct Dosage</label>
                        <input type="text" id="dosage" required placeholder="e.g. 1 tablet every 6 hours" 
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Manufacturer / Company</label>
                        <input type="text" id="manufacturer" required placeholder="e.g. Cipla / GSK" 
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Side Effects</label>
                    <textarea id="sideEffects" rows="2" required placeholder="Mention potential side effects..." 
                              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-teal-200 transition-all text-base">
                    SAVE MEDICINE TO ENCYCLOPEDIA 🚀
                </button>
            </form>
        </div>
    </main>

    <script>
        async function submitMedicine(e) {
            e.preventDefault();

            const payload = {
                name: document.getElementById('medName').value,
                genericName: document.getElementById('genericName').value,
                brand: document.getElementById('brand').value,
                category: document.getElementById('category').value,
                uses: document.getElementById('uses').value,
                dosage: document.getElementById('dosage').value,
                manufacturer: document.getElementById('manufacturer').value,
                sideEffects: document.getElementById('sideEffects').value
            };

            try {
                const res = await fetch('/api/medicines', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    alert('🎉 Medicine added successfully to the database!');
                    document.getElementById('medicineForm').reset();
                } else {
                    alert('Failed to add medicine.');
                }
            } catch (err) {
                alert('Server connection error.');
            }
        }
    </script>
</body>
</html>
