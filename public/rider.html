<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kwiky Hero | Rider App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --primary: #fc8019; --card: #1e293b; --green: #22c55e; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0b1120; color: white; padding: 14px; }
    .nav { background: var(--card); padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="nav">
    <div><strong>Hero #KW-171</strong><p style="font-size:11px; color:#94a3b8;" id="gpsTxt">GPS: Live</p></div>
    <span style="color:var(--green); font-size:12px; font-weight:800;">● Online</span>
  </div>

  <div id="trips">Loading trips...</div>

  <script>
    const socket = io();
    let currentOrderId = null;

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((pos) => {
        const { latitude, longitude } = pos.coords;
        document.getElementById('gpsTxt').innerText = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
        if (currentOrderId) {
          socket.emit('rider:locationUpdate', { riderId: 'KW-171', orderId: currentOrderId, lat: latitude, lng: longitude });
        }
      }, null, { enableHighAccuracy: true });
    }

    async function loadTrips() {
      const res = await fetch('/api/orders');
      const d = await res.json();
      const trips = (d.orders || []).filter(o => o.status !== 'Delivered');
      const box = document.getElementById('trips');

      if (trips.length === 0) {
        currentOrderId = null;
        box.innerHTML = `<p style="color:#94a3b8;">No active deliveries.</p>`;
        return;
      }

      currentOrderId = trips[0]._id;
      box.innerHTML = trips.map(t => `
        <div class="card">
          <p><strong>Order #${t._id.slice(-6)}</strong> (${t.status})</p>
          <p style="font-size:12px; color:#94a3b8; margin:6px 0;">Deliver To: ${t.address}</p>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.address)}" target="_blank" style="color:#38bdf8; font-size:12px; font-weight:bold; display:block; margin:6px 0;">Open in Google Maps</a>
          <button class="btn" style="background:var(--green); color:white;" onclick="markDelivered('${t._id}')">Mark Delivered (Collect ৳${t.total})</button>
        </div>
      `).join('');
    }

    async function markDelivered(id) {
      await fetch(`/api/order/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'Delivered' })
      });
      loadTrips();
    }

    socket.on('order:new', () => loadTrips());
    window.addEventListener('DOMContentLoaded', loadTrips);
  </script>
</body>
</html>
