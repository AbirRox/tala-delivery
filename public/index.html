<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tala Express - Fast Local Delivery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #f8f9fa;
      color: #1e272e;
      padding-bottom: 80px;
    }
    header {
      background: #ffffff;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #e67e22;
    }
    .cart-badge {
      background: #e67e22;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    .menu-title {
      font-size: 18px;
      margin: 16px 0 12px;
      font-weight: 700;
    }
    .item-card {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .item-details h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    .item-details p {
      font-size: 14px;
      color: #636e72;
      font-weight: 600;
    }
    .add-btn {
      background: #2ed573;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .checkout-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
    }
    .checkout-content {
      background: white;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .checkout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .close-btn {
      font-size: 24px;
      cursor: pointer;
      border: none;
      background: none;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #2d3436;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dfe4ea;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: #e67e22;
    }
    .location-btn {
      background: #0984e3;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .location-status {
      font-size: 12px;
      margin-top: 6px;
      min-height: 16px;
    }
    .order-summary {
      background: #f1f2f6;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .submit-btn {
      background: #e67e22;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tala Express</h1>
    <div class="cart-badge" onclick="openCheckout()">
      Cart (<span id="cartCount">0</span>)
    </div>
  </header>

  <div class="container">
    <h2 class="menu-title">Available Menu</h2>
    
    <div class="item-card">
      <div class="item-details">
        <h3>Chicken Biryani</h3>
        <p>180 BDT</p>
      </div>
      <button class="add-btn" onclick="addToCart('Chicken Biryani', 180)">+ Add</button>
    </div>

    <div class="item-card">
      <div class="item-details">
        <h3>Beef Khichuri</h3>
        <p>160 BDT</p>
      </div>
      <button class="add-btn" onclick="addToCart('Beef Khichuri', 160)">+ Add</button>
    </div>

    <div class="item-card">
      <div class="item-details">
        <h3>Egg Fried Rice</h3>
        <p>120 BDT</p>
      </div>
      <button class="add-btn" onclick="addToCart('Egg Fried Rice', 120)">+ Add</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="checkout-modal" id="checkoutModal">
    <div class="checkout-content">
      <div class="checkout-header">
        <h2>Complete Order</h2>
        <button class="close-btn" onclick="closeCheckout()">&times;</button>
      </div>

      <div class="order-summary" id="orderSummary">
        Your cart is empty.
      </div>

      <form id="orderForm" onsubmit="handleOrderSubmit(event)">
        <div class="form-group">
          <label for="customerName">Full Name</label>
          <input type="text" id="customerName" placeholder="Enter your name" required />
        </div>

        <div class="form-group">
          <label for="customerPhone">Mobile Number</label>
          <input 
            type="tel" 
            id="customerPhone" 
            placeholder="11-digit number (e.g. 017XXXXXXXX)" 
            maxlength="11" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="customerAddress">Delivery Address</label>
          <textarea 
            id="customerAddress" 
            rows="3" 
            placeholder="House/Road no, Area, Village, or Landmark" 
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label>Pinpoint Live Location</label>
          <button type="button" class="location-btn" onclick="getExactLocation()">
            📍 Share Current Location (Google Maps)
          </button>
          <input type="hidden" id="mapLocation" />
          <div class="location-status" id="locationStatus"></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Place Order</button>
      </form>
    </div>
  </div>

  <script>
    let cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCartBadge();
      alert(name + " added to cart!");
    }

    function updateCartBadge() {
      document.getElementById('cartCount').innerText = cart.length;
    }

    function openCheckout() {
      if (cart.length === 0) {
        alert("Your cart is empty! Please add items first.");
        return;
      }
      const summaryDiv = document.getElementById('orderSummary');
      let total = 0;
      let itemsHtml = "<strong>Selected Items:</strong><br/>";
      cart.forEach(item => {
        itemsHtml += `• ${item.name} - ${item.price} BDT<br/>`;
        total += item.price;
      });
      itemsHtml += `<br/><strong>Total Amount: ${total} BDT</strong>`;
      summaryDiv.innerHTML = itemsHtml;

      document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeCheckout() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    function getExactLocation() {
      const status = document.getElementById('locationStatus');
      const mapInput = document.getElementById('mapLocation');

      if (!navigator.geolocation) {
        status.innerText = "Geolocation is not supported by your browser.";
        status.style.color = "red";
        return;
      }

      status.innerText = "Locating your exact coordinates...";
      status.style.color = "#0984e3";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          mapInput.value = `https://www.google.com/maps?q=${lat},${lon}`;
          status.innerText = "✅ Exact GPS location attached!";
          status.style.color = "#2ed573";
        },
        (error) => {
          status.innerText = "Location permission denied. Please write full address.";
          status.style.color = "#d63031";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function handleOrderSubmit(event) {
      event.preventDefault();

      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const address = document.getElementById('customerAddress').value.trim();
      const mapLocation = document.getElementById('mapLocation').value;

      // 11-digit mobile number validation starting with 01
      const phonePattern = /^01[3-9]\d{8}$/;
      if (!phonePattern.test(phone)) {
        alert("Please enter a valid 11-digit mobile number (e.g., 01712345678).");
        return;
      }

      const totalAmount = cart.reduce((sum, item) => sum + item.price, 0);

      const payload = {
        name,
        phone,
        address,
        mapLocation,
        items: cart,
        total: totalAmount
      };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Placing Order...";

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert("Order placed successfully!");
          cart = [];
          updateCartBadge();
          closeCheckout();
          document.getElementById('orderForm').reset();
          document.getElementById('locationStatus').innerText = "";
        } else {
          alert("Failed to submit order. Please try again.");
        }
      } catch (err) {
        alert("Server connection error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Place Order";
      }
    }
  </script>
</body>
</html>
